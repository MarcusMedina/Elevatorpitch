<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Elevator pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=Lilita+One&display=swap">
<style>
/* Layout: Elevator pitch, ett kort i mitten, tidknapp under dra-knappen. Varmt papper och vinröd baksida. */
/* (motor från Icebreakers) Layout: ett enda kort i mitten, dra-knapp inom tumme, sorteringsval under. Kortet är ett fysiskt objekt och ser likadant ut i båda teman. */
:root{
  --bg:#EFE8DA; --fg:#2B2118; --muted:#6B5A48; --line:#D2C5AE;
  --btn:#2B2118; --btn-fg:#F8F3E8; --chip:#F7F1E4; --chip-on:#FFFFFF; --shadow:rgba(43,33,24,.22);
  /* kortets egna färger */
  --paper:#FBF8F1; --ink:#1F2036; --back:#5A1E2D; --gold-b:#E7B13C;
  --skin:#EFC9A3; --wood:#8A5A3A; --gold:#E7B13C; --steel:#C5CDD8; --night:#27305C; --leaf:#3C8A5E; --ice:#D6E8F4;
  --display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1612; --fg:#F2EADB; --muted:#B5A58E; --line:#41342A;
    --btn:#E8B84A; --btn-fg:#1F160F; --chip:#2A2019; --chip-on:#3A2D23; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1612; --fg:#F2EADB; --muted:#B5A58E; --line:#41342A;
  --btn:#E8B84A; --btn-fg:#1F160F; --chip:#2A2019; --chip-on:#3A2D23; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  --off:210px;
  background:var(--bg);color:var(--fg);font-family:var(--ui);
  padding-block:18px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:400 1.7rem/1 var(--display);margin:0;letter-spacing:.01em}
.count{margin:0;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}

.topr{display:flex;align-items:center;gap:12px}
.helpbtn{min-height:38px;padding:0 14px}
body.help .stage,body.help .draw:not(#helpclose),body.help .modes,body.help .chips,body.help .foot,body.help .count{display:none}
.help{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.help h2{font:400 1.9rem/1.05 var(--display);margin:4px 0 0;text-wrap:balance}
.help h2:focus{outline:none}
.help h3{font:700 .75rem/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.help p,.help li{font-size:1rem;line-height:1.5;margin:0}
.help ol,.help ul{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:8px}
.help code{font:700 .9rem/1.3 ui-monospace,Menlo,Consolas,monospace;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 6px;overflow-wrap:anywhere}
.help .note{color:var(--muted);font-size:.9rem}
.help .draw{margin-top:8px}
.stage{perspective:1000px;display:flex;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:22px}
.stage:focus-visible,.draw:focus-visible,.chip:focus-visible,.shuffle:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

[data-cat]{--art-deep:color-mix(in srgb,var(--art) 62%,#1F2036)}
[data-cat="karaktar"]{--art:#B5372E;--tint:#F5D9D3}
[data-cat="sak"]{--art:#B7791F;--tint:#F4E4BE}
[data-cat="plats"]{--art:#2E7A57;--tint:#D3EADB}
[data-cat="egenskap"]{--art:#6A4C9C;--tint:#E2D9F0}
[data-cat="handelse"]{--art:#1F6F9F;--tint:#D0E5F2}
[data-cat="slut"]{--art:#B8397A;--tint:#F5D6E6}

.card{
  width:min(100%,340px,max(220px,calc((100svh - var(--off)) * .714)));
  aspect-ratio:5/7;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:20px;padding:12px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 8px 0 var(--shadow);backface-visibility:hidden;
}
.label{display:flex;align-items:center;gap:8px;font:700 .72rem/1 var(--ui);letter-spacing:.16em;text-transform:uppercase}
.label i{width:12px;height:12px;background:var(--art);border:2px solid var(--ink);border-radius:3px;display:block}
.art{flex:1;min-height:0;background:var(--tint);border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;padding:10px}
.art svg{width:100%;height:100%;display:block;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.name{font:400 clamp(1.6rem,7.4vw,2.2rem)/1.05 var(--display);text-align:center;text-wrap:balance;min-height:1.1em;display:grid;place-items:center;padding-inline:4px}
.q{font:700 clamp(.88rem,3.9vw,1.05rem)/1.28 var(--ui);text-align:center;text-wrap:balance;min-height:3.8em;display:grid;place-items:center;padding-inline:2px}

.art .a{fill:var(--art)}.art .b{fill:var(--art-deep)}.art .k{fill:var(--ink)}.art .p{fill:var(--paper)}
.art .s{fill:var(--skin)}.art .w{fill:var(--wood)}.art .g{fill:var(--gold)}.art .t{fill:var(--steel)}
.art .n{fill:var(--night)}.art .f{fill:var(--leaf)}.art .i{fill:var(--ice)}
.art .z{fill:none}.art .x{stroke:none}.art .hl{stroke:var(--paper)}.art .sa{stroke:var(--art)}
.art .qm{font:400 22px var(--display);fill:var(--ink);stroke:none}

.card.back{background:var(--back);padding:10px;border-color:var(--ink)}
.card.back svg{width:100%;height:100%;display:block}
.card.back .ln{fill:none;stroke:var(--gold-b);stroke-width:2}
.card.back .fl{fill:var(--gold-b);stroke:none}
.card.back .bt{font:400 25px var(--display);fill:var(--gold-b);text-anchor:middle}
.card.back .bs{font:700 11px var(--ui);fill:var(--gold-b);text-anchor:middle;letter-spacing:.18em;text-transform:uppercase}

.draw{
  appearance:none;border:0;background:var(--btn);color:var(--btn-fg);
  font:400 1.45rem/1 var(--display);letter-spacing:.02em;
  min-height:60px;border-radius:16px;cursor:pointer;width:100%;
  box-shadow:0 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s;
}
.draw:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}

.hand{display:flex;gap:10px;justify-content:center;width:100%}
.hand[data-n="2"] .card{width:calc((100% - 10px)/2);padding:8px;border-radius:14px;gap:6px;box-shadow:0 6px 0 var(--shadow)}
.hand[data-n="2"] .card.back{padding:6px}
.hand[data-n="2"] .label{font-size:.58rem;letter-spacing:.08em;gap:6px}
.hand[data-n="2"] .label i{width:9px;height:9px;border-width:1.5px}
.hand[data-n="2"] .art{padding:5px;border-radius:9px;border-width:2px}
.hand[data-n="2"] .name{font-size:clamp(1rem,5.2vw,1.45rem);min-height:1.1em;padding-inline:0}
.hand[data-n="2"] .q{font-size:clamp(.66rem,3vw,.8rem);line-height:1.22;min-height:4.8em;padding:0}
.modes{display:flex;align-items:center;justify-content:center;gap:12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.segb,.posb,.npb{appearance:none;border:0;background:var(--chip);color:var(--fg);min-width:56px;min-height:42px;font:700 1rem/1 var(--ui);cursor:pointer}
.segb[aria-pressed="true"],.posb[aria-pressed="true"],.npb[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.posb,.npb{min-width:44px}
.code{width:150px;min-height:42px;padding:0 14px;background:var(--chip);color:var(--fg);border:2px solid var(--line);border-radius:999px;font:700 1rem/1 var(--ui);text-align:center}
.rnd{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.code::placeholder{color:var(--muted);font-weight:500}
.card.end,.hand[data-n="2"] .card.end{width:min(100%,340px,max(260px,calc((100svh - var(--off)) * .714)));padding:22px;gap:14px;justify-content:center;align-items:center;text-align:center;border-radius:20px}
.endt{font:400 clamp(1.7rem,8vw,2.3rem)/1.05 var(--display);text-wrap:balance}
.card.end p{margin:0;font-size:1rem;line-height:1.4;max-width:24ch}
.endb{display:flex;flex-direction:column;gap:10px;width:100%}
.card.end .chip{justify-content:center;background:transparent;color:var(--ink);border-color:var(--ink)}
.card.end .code{width:100%;background:var(--paper);color:var(--ink);border-color:var(--ink)}
.card.end .code::placeholder{color:#6d6a78}
.code:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.modes{flex-wrap:wrap}
.segb:focus-visible,.posb:focus-visible,.npb:focus-visible{outline:3px solid var(--fg);outline-offset:-3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{
  appearance:none;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;
  background:var(--chip);color:var(--fg);border:2px solid var(--line);border-radius:999px;
  font:700 .85rem/1 var(--ui);cursor:pointer;
}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--art,var(--fg));display:block}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--fg)}
.shuffle{
  appearance:none;background:none;border:0;color:var(--muted);font:700 .85rem/1 var(--ui);
  min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:center;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.foot{display:flex;justify-content:center;flex-wrap:wrap;column-gap:24px}
.exit{display:none;position:fixed;z-index:20;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px))}
body.full{--off:130px}
body.full .top,body.full .modes,body.full .chips,body.full .foot{display:none}
body.full .exit{display:inline-flex}
body.full .app{max-width:520px;min-height:calc(100svh - 120px);justify-content:center}
body.full .hand[data-n="1"] .card{width:min(100%,460px,max(220px,calc((100svh - var(--off)) * .714)))}
@media (prefers-reduced-motion: reduce){.draw{transition:none}}

.tmb{appearance:none;border:0;background:var(--chip);color:var(--fg);min-width:56px;min-height:42px;font:700 1rem/1 var(--ui);cursor:pointer}
.tmb[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.tmb:focus-visible{outline:3px solid var(--fg);outline-offset:-3px}
#timer{font-variant-numeric:tabular-nums;min-width:132px;justify-content:center}
#timer.up{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
body.full .modes.tmrow{display:flex}
body.full .tmrow>span,body.full .tmrow .seg{display:none}
body.full #timer{min-height:52px;font-size:1.05rem}
.helpbody{display:flex;flex-direction:column;gap:12px}
#langbtn{min-width:44px;justify-content:center}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Elevator pitch</h1>
    <div class="topr"><p class="count" id="count"></p><button type="button" class="chip helpbtn" id="langbtn" lang="en">EN</button><button type="button" class="chip helpbtn" id="helpbtn" aria-expanded="false" aria-controls="help">Regler</button></div>
  </header>
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Dra ett kort">
    <div class="hand" id="hand" data-n="1"></div>
  </div>
  <button class="draw" id="draw" type="button">Dra kort</button>
  <div class="modes tmrow" id="tmgroup" role="group" aria-label="Pitch-tid"><span id="tmlabel">Pitch-tid</span><div class="seg"><button type="button" class="tmb" id="tmoff" data-t="0" aria-pressed="false">Av</button><button type="button" class="tmb" data-t="30" aria-pressed="true">30 s</button><button type="button" class="tmb" data-t="60" aria-pressed="false">60 s</button></div><button type="button" class="chip" id="timer">Starta 30 s</button></div>
  <div class="modes" id="coderow" hidden><label for="code" id="codelabel">Spelkod</label><input id="code" class="code" type="text" maxlength="16" placeholder="gemensamt ord" autocomplete="off" autocapitalize="none" spellcheck="false"><span class="rnd" id="rnd"></span></div>
  <div class="modes" id="npgroup" role="group" aria-label="Antal spelare"><span id="nplabel">Spelare</span><div class="seg"><button type="button" class="npb" data-np="1" aria-pressed="true">1</button><button type="button" class="npb" data-np="2" aria-pressed="false">2</button><button type="button" class="npb" data-np="3" aria-pressed="false">3</button><button type="button" class="npb" data-np="4" aria-pressed="false">4</button></div></div>
  <div class="modes" id="posrow" role="group" aria-label="Din position" hidden><span id="poslabel">Din position</span><div class="seg"><button type="button" class="posb" data-pos="1" aria-pressed="true">1</button><button type="button" class="posb" data-pos="2" aria-pressed="false">2</button><button type="button" class="posb" data-pos="3" aria-pressed="false">3</button><button type="button" class="posb" data-pos="4" aria-pressed="false">4</button></div></div>
  <div class="modes" id="ngroup" role="group" aria-label="Antal kort per drag"><span id="nlabel">Kort per drag</span><div class="seg"><button type="button" class="segb" data-n="1" aria-pressed="true">1</button><button type="button" class="segb" data-n="2" aria-pressed="false">2</button></div></div>
  <div class="chips" id="chips" role="group" aria-label="Vilka kort ska dras?"></div>
  <div class="foot"><button class="shuffle" id="shuffle" type="button">Blanda om högen</button><button class="shuffle" id="full" type="button" aria-pressed="false">Helskärm</button></div>
  <button class="chip exit" id="exit" type="button">Stäng helskärm</button>
  <section id="help" class="help" hidden aria-labelledby="helph">
    <h2 id="helph" tabindex="-1">Så spelar ni</h2>
    <div id="helpbody" class="helpbody"></div>
    <button type="button" class="draw" id="helpclose">Tillbaka till spelet</button>
  </section>
  <p class="sr" id="live" aria-live="polite"></p>
</main>

<script>
/* Hjälpare för ritningarna */
const S=(x,y,s=9)=>`<path class="g" transform="translate(${x} ${y}) scale(${s/9})" d="M0-9Q2-2 9 0Q2 2 0 9Q-2 2-9 0Q-2-2 0-9Z"/>`;
const sword=()=>`<path class="t" d="M55 76V24L60 12l5 12v52z"/><path class="z" d="M60 26v44"/><rect class="g" x="42" y="76" width="36" height="7" rx="3"/><rect class="w" x="56" y="83" width="8" height="16" rx="2"/><circle class="g" cx="60" cy="104" r="5"/>`;
const pine=()=>`<rect class="w" x="-4" y="20" width="8" height="16"/><path class="f" d="M0-40L-18-8H-9L-26 22H26L9-8H18Z"/>`;
const ring=(cx,cy,ro,ri)=>`<path class="g" fill-rule="evenodd" d="M${cx-ro} ${cy}a${ro} ${ro} 0 1 0 ${ro*2} 0a${ro} ${ro} 0 1 0 ${-ro*2} 0zM${cx-ri} ${cy}a${ri} ${ri} 0 1 0 ${ri*2} 0a${ri} ${ri} 0 1 0 ${-ri*2} 0z"/>`;
const coin=(x,y)=>`<path class="g" d="M${x-18} ${y-7}V${y}A18 6 0 0 0 ${x+18} ${y}V${y-7}Z"/><ellipse class="g" cx="${x}" cy="${y-7}" rx="18" ry="6"/>`;
const link=()=>`<path class="t" fill-rule="evenodd" d="M26 44h16a16 16 0 0 1 0 32H26a16 16 0 0 1 0-32zM26 53h16a7 7 0 0 1 0 14H26a7 7 0 0 1 0-14z"/>`;
const SP="M60 60a4 4 0 0 1 8 0a8 8 0 0 1-16 0a12 12 0 0 1 24 0a16 16 0 0 1-32 0a20 20 0 0 1 40 0a24 24 0 0 1-48 0a28 28 0 0 1 56 0";

const BASE=[
/* ---------- KARAKTÄRER ---------- */
{k:'karaktar',n:'Kung',a:`<path class="a" d="M26 112c0-22 15-32 34-32s34 10 34 32z"/><circle class="s" cx="60" cy="62" r="20"/><path class="p" d="M42 66q0 26 18 28q18-2 18-28q-6 12-18 12t-18-12z"/><path class="g" d="M40 46L38 24L52 36L60 18L68 36L82 24L80 46Z"/><circle class="k x" cx="53" cy="58" r="2.4"/><circle class="k x" cx="67" cy="58" r="2.4"/>`},
{k:'karaktar',n:'Prinsessa',a:`<path class="w" d="M36 100V58q0-26 24-26t24 26v42q-8 4-12-6H48q-4 10-12 6z"/><path class="a" d="M30 116c0-18 12-26 30-26s30 8 30 26z"/><circle class="s" cx="60" cy="62" r="18"/><path class="w" d="M42 58q4-18 18-18t18 18q-12-8-18-4t-18 4z"/><path class="g" d="M46 40l4-12 5 7 5-11 5 11 5-7 4 12z"/><circle class="k x" cx="53" cy="64" r="2.2"/><circle class="k x" cx="67" cy="64" r="2.2"/><path class="z" d="M54 72q6 5 12 0"/>`},
{k:'karaktar',n:'Riddare',a:`<path class="a" d="M24 114c0-20 14-28 36-28s36 8 36 28z"/><path class="t" d="M38 62q0-28 22-28t22 28v22q0 8-8 8H46q-8 0-8-8z"/><rect class="k" x="42" y="60" width="36" height="7" rx="2"/><path class="z" d="M60 34v26M60 67v25"/><path class="a" d="M58 36q-10-16 6-24q14 8 4 24z"/>`},
{k:'karaktar',n:'Häxa',a:`<path class="n" d="M20 108c0-20 16-30 40-30s40 10 40 30z"/><circle class="f" cx="60" cy="66" r="17"/><path class="n" d="M32 52h56l-4 8H36z"/><path class="n" d="M44 52L62 10Q66 6 72 14L76 52Z"/><path class="a" d="M46.5 44h28.5l1 6H44z"/><circle class="g" cx="53" cy="65" r="3"/><circle class="g" cx="67" cy="65" r="3"/><path class="z" d="M60 66l-3 8h6"/><path class="z" d="M53 77q7 4 14 0"/>`},
{k:'karaktar',n:'Trollkarl',a:`<path class="n" d="M26 114c0-20 14-30 34-30s34 10 34 30z"/><circle class="s" cx="60" cy="64" r="17"/><path class="p" d="M43 66q0 30 17 32q17-2 17-32q-8 12-17 12t-17-12z"/><path class="n" d="M38 50h44l-6 8H44z"/><path class="a" d="M46 50Q50 30 62 8Q70 28 74 50Z"/>${S(62,34,7)}<circle class="k x" cx="54" cy="63" r="2"/><circle class="k x" cx="66" cy="63" r="2"/>`},
{k:'karaktar',n:'Tomte',a:`<path class="t" d="M30 114c0-18 12-24 30-24s30 6 30 24z"/><path class="p" d="M36 58C34 98 48 106 60 106S86 98 84 58Z"/><circle class="s" cx="60" cy="70" r="6"/><path class="a" d="M34 60Q38 24 72 12Q88 8 86 26Q82 42 86 60Z"/>`},

  const picked=[];
  for(let j=0;j<st.n;j++){
    let a=avail();if(!a.length)break;
    if(j>0){const other=a.filter(i=>C[i].n!==C[picked[0]].n);if(other.length)a=other}
    const i=a[Math.floor(Math.random()*a.length)];st.used.add(i);picked.push(i);
  }
  const hand=$('hand');
  if(hand.children.length!==st.n||hand.querySelector('.end'))setHand(st.n);
  for(let j=picked.length;j<st.n;j++){const el=hand.children[j];el.className='card back';el.removeAttribute('data-cat');el.innerHTML=backSVG()}
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  await Promise.all(picked.map((i,j)=>flip(hand.children[j],C[i],j*110,calm)));
  st.shown=picked;
  $('live').textContent=picked.map(i=>`${cn(C[i])}. ${cq(C[i])}`).join('. ');
  st.drawn=true;$('draw').textContent=label();count();st.busy=false;
}
function reshuffle(){
  if(st.busy)return;
  if(st.np>1)st.round=(st.round+1)%100;
  tStop();build();st.used.clear();st.drawn=false;paintBack();syncPlayersUI();
  $('draw').textContent=label();count();hashSync();$('live').textContent=L().shuffled;
}
function setMode(n){
  if(st.busy)return;st.n=n;st.drawn=false;paintBack();
  document.querySelectorAll('.segb').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===n));
  $('draw').textContent=label();count();
  hashSync();
}
function hashSync(){
  const h=[st.code?'kod-'+st.code:'',st.np>1&&st.round?'omgang-'+st.round:'',st.np>1?'spelare-'+st.np:'',st.np>1?'plats-'+st.pos:'',st.n===2?'tva-kort':'',st.lang==='en'?'eng':''].filter(Boolean).join('-');
  try{location.hash=h}catch(e){}
}
function syncPlayersUI(){
  document.querySelectorAll('.npb').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.np===st.np));
  document.querySelectorAll('.posb').forEach(b=>{const k=+b.dataset.pos;b.hidden=k>st.np;b.setAttribute('aria-pressed',k===st.pos)});
  $('posrow').hidden=st.np<2;$('coderow').hidden=st.np<2;$('rnd').textContent=L().round(st.round+1);
}
function restart(){tStop();build();st.used.clear();st.drawn=false;paintBack();syncPlayersUI();$('draw').textContent=label();count();hashSync()}
function setCode(v){if(st.busy)return;st.code=clean(v);st.round=0;$('code').value=st.code;restart();if(st.np>1&&!st.code)showAsk()}
function setPos(k){if(st.busy)return;st.pos=k;restart()}
function setPlayers(np){if(st.busy)return;st.np=np;if(st.pos>np)st.pos=1;restart();if(np>1&&!st.code)showAsk()}

/* Pitch-tid */
let tsec=30,tleft=0,tint=null;
const tFmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function tStop(){
  clearInterval(tint);tint=null;
  const b=$('timer');b.classList.remove('up');b.hidden=!tsec;b.textContent=L().tstart(tsec);
}
function tSet(s){
  tsec=s;
  document.querySelectorAll('.tmb').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.t===s));
  tStop();
}
function tStart(){
  if(tint){tStop();return}
  const T=L();tleft=tsec;$('timer').textContent=tFmt(tleft)+' · '+T.tstop;
  tint=setInterval(()=>{
    tleft--;
    if(tleft<=0){
      clearInterval(tint);tint=null;
      $('timer').classList.add('up');$('timer').textContent=L().tup;
      $('live').textContent=L().tup;
      try{navigator.vibrate&&navigator.vibrate(250)}catch(e){}
    }else $('timer').textContent=tFmt(tleft)+' · '+L().tstop;
  },1000);
}
document.querySelectorAll('.tmb').forEach(b=>b.addEventListener('click',()=>tSet(+b.dataset.t)));
$('timer').addEventListener('click',tStart);

CHIPKEYS.forEach(key=>{
  const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.key=key;b.setAttribute('aria-pressed',key==='alla');
  b.addEventListener('click',()=>{st.filter=key;document.querySelectorAll('#chips .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));count()});
  $('chips').appendChild(b);
});

/* Språk: all text sätts härifrån. Bilder och kortfördelning är oberoende av språket. */
function applyLang(){
  const T=L();
  try{document.documentElement.lang=st.lang}catch(e){}
  $('stage').setAttribute('aria-label',T.stage);
  $('tmlabel').textContent=T.timeLabel;$('tmgroup').setAttribute('aria-label',T.timeLabel);$('tmoff').textContent=T.off;
  $('codelabel').textContent=T.code;$('code').placeholder=T.codePh;
  $('nplabel').textContent=T.players;$('npgroup').setAttribute('aria-label',T.players);
  $('poslabel').textContent=T.pos;$('posrow').setAttribute('aria-label',T.pos);
  $('nlabel').textContent=T.perDraw;$('ngroup').setAttribute('aria-label',T.perDraw);
  $('chips').setAttribute('aria-label',T.which);
  document.querySelectorAll('#chips .chip').forEach(b=>{b.textContent=T.chips[b.dataset.key]});
  $('shuffle').textContent=T.shuffle;$('full').textContent=T.full;$('exit').textContent=T.exit;
  $('helph').textContent=T.helpTitle;$('helpbody').innerHTML=T.help;$('helpclose').textContent=T.back;
  $('helpbtn').textContent=document.body.classList.contains('help')?T.close:T.rules;
  $('langbtn').textContent=T.other;$('langbtn').setAttribute('aria-label',T.switchTo);$('langbtn').setAttribute('lang',st.lang==='en'?'sv':'en');
  tStop();syncPlayersUI();
  const hand=$('hand');
  if(st.over)showOver();
  else if(st.end)showEnd();
  else if(st.ask){const v=$('startcode')?$('startcode').value:'';showAsk();$('startcode').value=v}
  else if(st.drawn&&st.shown.length){for(let j=0;j<hand.children.length;j++){const el=hand.children[j];if(j<st.shown.length)paintFront(el,C[st.shown[j]]);else el.innerHTML=backSVG()}}
  else paintBack();
  $('draw').textContent=label();count();hashSync();
}
function setLang(l){
  if(st.busy)return;st.lang=l;
  try{localStorage.setItem('pitch-lang',l)}catch(e){}
  applyLang();
}
$('langbtn').addEventListener('click',()=>setLang(st.lang==='en'?'sv':'en'));

$('draw').addEventListener('click',draw);
$('stage').addEventListener('click',e=>{if(e.target.closest('.end'))return;draw()});
$('hand').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act==='reshuffle')reshuffle();
  else if(act==='over')showOver();
  else if(act==='start'){const v=clean($('startcode').value);if(!v){$('startcode').focus();return}setCode(v)}
});
$('stage').addEventListener('keydown',e=>{if(e.target!==$('stage'))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();draw()}});
$('shuffle').addEventListener('click',reshuffle);
function setHelp(on){
  document.body.classList.toggle('help',on);$('help').hidden=!on;
  $('helpbtn').setAttribute('aria-expanded',on);$('helpbtn').textContent=on?L().close:L().rules;
  window.scrollTo(0,0);
  if(on)$('helph').focus();else $('helpbtn').focus();
}
$('helpbtn').addEventListener('click',()=>setHelp(!document.body.classList.contains('help')));
$('helpclose').addEventListener('click',()=>setHelp(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('help'))setHelp(false)});
let wake=null;
async function setFull(on){
  document.body.classList.toggle('full',on);
  $('full').setAttribute('aria-pressed',on);
  if(on){
    try{await document.documentElement.requestFullscreen()}catch(e){}
    try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}
  }else{
    try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}
    try{if(wake){await wake.release();wake=null}}catch(e){}
  }
}
$('full').addEventListener('click',()=>setFull(true));
$('exit').addEventListener('click',()=>setFull(false));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('full'))setFull(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('full'))setFull(false)});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&document.body.classList.contains('full')&&!wake){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}});
document.querySelectorAll('.segb').forEach(b=>b.addEventListener('click',()=>setMode(+b.dataset.n)));
const hh=location.hash;
if(/tva-kort/.test(hh))st.n=2;
const cm=hh.match(/kod-([a-z0-9]+)/);if(cm)st.code=cm[1];
const rm=hh.match(/omgang-(\d{1,2})/);if(rm)st.round=+rm[1];
const nm=hh.match(/spelare-([2-4])/);if(nm)st.np=+nm[1];
const pm=hh.match(/plats-([1-4])/);if(pm&&+pm[1]<=st.np)st.pos=+pm[1];
/* Språkval: länken först, sedan sparat val, sedan webbläsarens språk */
let saved=null;try{saved=localStorage.getItem('pitch-lang')}catch(e){}
if(/(^|[#-])eng($|-)/.test(hh.replace(/kod-[a-z0-9]+/,'')))st.lang='en';
else if(saved==='en'||saved==='sv')st.lang=saved;
else st.lang=/^sv\b/i.test((navigator&&navigator.language)||'sv')?'sv':'en';
document.querySelectorAll('.npb').forEach(b=>b.addEventListener('click',()=>setPlayers(+b.dataset.np)));
document.querySelectorAll('.posb').forEach(b=>b.addEventListener('click',()=>setPos(+b.dataset.pos)));
$('code').value=st.code;
$('code').addEventListener('change',e=>setCode(e.target.value));
build();
document.querySelectorAll('.segb').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===st.n));
applyLang();
if(st.np>1&&!st.code)showAsk();
</script>
</body>
</html>
